name: MAD-Website CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-check:
    name: Build & Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Check Build
        run: npm run build

      - name: Check for outdated packages
        run: npm outdated || true
